kind = "web"
previewPath = "/"
title = "MedOrbit | ميد أوربت"
description = "تطبيق عربي لإدارة دليل الأطباء والمنتجات التجريبية وتقارير الزيارات ولوحة الشركة، ببيانات خيالية محفوظة في قاعدة بيانات."
version = "1.0.0"
id = "artifacts/medorbit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20372

[services.development]
run = "pnpm --filter @workspace/medorbit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medorbit", "run", "build" ]
serve = "static"
publicDir = "artifacts/medorbit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20372"
BASE_PATH = "/"
