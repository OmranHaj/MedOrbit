openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MedOrbit fictional medical representative directory and visit records
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /doctors/{id}/briefing:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getDoctorBriefing
      responses:
        "200":
          description: Grounded structured Arabic summary, explicitly not generative AI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DoctorBriefing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /smart-route/options:
    get:
      operationId: getSmartRouteOptions
      responses:
        "200":
          description: Saved doctor regions and predefined fictional starting coordinates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmartRouteOptions" }
  /smart-route/plan:
    post:
      operationId: planSmartRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmartRouteInput" }
      responses:
        "200":
          description: Read-only approximate greedy tour, not globally optimal or traffic routing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmartRoutePlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /verification/representative-session:
    post:
      operationId: startRepresentativeSession
      responses:
        "200":
          description: Server-issued anonymous demo representative identity, HttpOnly cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSession" }
  /clinic-demo/session:
    post:
      operationId: startClinicDemoSession
      responses:
        "200":
          description: Explicit simulator-only demo session, not real staff authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSession" }
  /pending-visits:
    get:
      operationId: listPendingVisits
      responses:
        "200":
          description: Most recent pending visit owned by this representative, never includes a code
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PendingVisit" } }
        "401": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: startPendingVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PendingVisitInput" }
      responses:
        "201":
          description: Pending visit, code is not returned to the representative
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingVisit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/BadRequest" }
  /pending-visits/{id}/verify:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyPendingVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationInput" }
      responses:
        "200":
          description: Consumes the code exactly once, permitting one visit report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingVisit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BadRequest" }
        "410": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/BadRequest" }
  /clinic-demo/pending-visits:
    get:
      operationId: listClinicDemoVisits
      parameters:
        - { name: doctorId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Active codes for simulated secretary only; requires separate demo clinic cookie
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ClinicDemoVisit" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/BadRequest" }
  /doctors:
    get:
      operationId: listDoctors
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 150 } }
        - { name: specialty, in: query, schema: { type: string, maxLength: 100 } }
        - { name: region, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Saved doctors
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Doctor" } }
    post:
      operationId: createDoctor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DoctorInput" }
      responses:
        "201":
          description: Saved doctor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /doctors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getDoctor
      responses:
        "200":
          description: Doctor profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateDoctor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DoctorInput" }
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products:
    get:
      operationId: listProducts
      responses:
        "200":
          description: Fictional demonstration products
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
  /visits:
    get:
      operationId: listVisits
      parameters:
        - { name: doctorId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Saved visit reports
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Visit" } }
    post:
      operationId: createVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitInput" }
      responses:
        "201":
          description: Saved report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Visit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/BadRequest" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Aggregates calculated from saved records only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    BriefingCitation:
      type: object
      required: [visitId, date, excerpt, verificationStatus]
      properties:
        visitId: { type: integer }
        date: { type: string }
        excerpt: { type: string }
        verificationStatus: { type: string, enum: ["Confirmed by clinic demo code", "Unverified legacy report"] }
    BriefingTimelineItem:
      type: object
      required: [visitId, date, productId, productName, outcome, notesExcerpt, notesWithheld, citation]
      properties:
        visitId: { type: integer }
        date: { type: string }
        productId: { type: integer }
        productName: { type: string }
        outcome: { $ref: "#/components/schemas/VisitOutcome" }
        notesExcerpt: { type: [string, "null"] }
        notesWithheld: { type: boolean }
        citation: { $ref: "#/components/schemas/BriefingCitation" }
    BriefingProduct:
      type: object
      required: [productId, productName, recordCount, citations]
      properties:
        productId: { type: integer }
        productName: { type: string }
        recordCount: { type: integer }
        citations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/BriefingCitation" } }
    BriefingInterests:
      type: object
      required: [text, sourceField, profileCreatedAt, visitCitations, notice]
      properties:
        text: { type: [string, "null"] }
        sourceField: { type: string, enum: [scientificInterests] }
        profileCreatedAt: { type: string }
        visitCitations: { type: array, items: { $ref: "#/components/schemas/BriefingCitation" } }
        notice: { type: string }
    BriefingRequest:
      type: object
      required: [quote, state, notice, citations]
      properties:
        quote: { type: string }
        state: { type: string, enum: [untracked] }
        notice: { type: string }
        citations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/BriefingCitation" } }
    BriefingFollowUp:
      type: object
      required: [text, citations]
      properties:
        text: { type: string }
        citations: { type: array, minItems: 1, items: { $ref: "#/components/schemas/BriefingCitation" } }
    DoctorBriefing:
      type: object
      required: [doctorId, doctorName, label, engine, generativeAiUsed, generatedAt, totalVisitCount, reviewedVisitCount, timeline, productsDiscussed, declaredScientificInterests, outstandingRequests, suggestedFollowUp, privacyOmittedVisitCount, limitations]
      properties:
        doctorId: { type: integer }
        doctorName: { type: string }
        label: { type: string, enum: ["ملخص آلي منظّم"] }
        engine: { type: string, enum: [rules] }
        generativeAiUsed: { type: boolean, enum: [false] }
        generatedAt: { type: string }
        totalVisitCount: { type: integer }
        reviewedVisitCount: { type: integer }
        timeline: { type: array, items: { $ref: "#/components/schemas/BriefingTimelineItem" } }
        productsDiscussed: { type: array, items: { $ref: "#/components/schemas/BriefingProduct" } }
        declaredScientificInterests: { $ref: "#/components/schemas/BriefingInterests" }
        outstandingRequests: { type: array, items: { $ref: "#/components/schemas/BriefingRequest" } }
        suggestedFollowUp: { type: array, items: { $ref: "#/components/schemas/BriefingFollowUp" } }
        privacyOmittedVisitCount: { type: integer }
        limitations: { type: array, items: { type: string } }
    DemoStartPoint:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    SmartRouteOptions:
      type: object
      required: [regions, startPoints, defaultVisitDurationMinutes, defaultTravelSpeedKmh, maxDoctorsPerRegion, demoRegion, assumptions]
      properties:
        regions: { type: array, items: { type: string } }
        startPoints: { type: array, items: { $ref: "#/components/schemas/DemoStartPoint" } }
        defaultVisitDurationMinutes: { type: integer }
        defaultTravelSpeedKmh: { type: number }
        maxDoctorsPerRegion: { type: integer }
        demoRegion: { type: string }
        assumptions: { type: array, items: { type: string } }
    SmartRouteInput:
      type: object
      additionalProperties: false
      required: [region, startPointId, startTime]
      properties:
        region: { type: string, minLength: 2, maxLength: 100 }
        startPointId: { type: string, minLength: 1, maxLength: 80 }
        startTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        visitDurationMinutes: { type: integer, minimum: 1, maximum: 120, default: 15 }
        travelSpeedKmh: { type: number, minimum: 1, maximum: 120, default: 25 }
    SmartRouteStop:
      type: object
      required: [order, doctorId, doctorName, region, visitingStart, visitingEnd, latitude, longitude, distanceKm, travelMinutes, arrivalTime, visitStartTime, departureTime, waitingMinutes]
      properties:
        order: { type: integer }
        doctorId: { type: integer }
        doctorName: { type: string }
        region: { type: string }
        visitingStart: { type: string }
        visitingEnd: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceKm: { type: number }
        travelMinutes: { type: integer }
        arrivalTime: { type: string }
        visitStartTime: { type: string }
        departureTime: { type: string }
        waitingMinutes: { type: integer }
    SmartRouteOmission:
      type: object
      required: [doctorId, doctorName, visitingStart, visitingEnd, reasonCode, reason, estimatedArrivalTime, estimatedDepartureTime]
      properties:
        doctorId: { type: integer }
        doctorName: { type: string }
        visitingStart: { type: string }
        visitingEnd: { type: string }
        reasonCode: { type: string, enum: [window_closed_at_start, insufficient_window, unreachable_from_start, cannot_fit_after_selected_visits, invalid_doctor_data] }
        reason: { type: string }
        estimatedArrivalTime: { type: [string, "null"] }
        estimatedDepartureTime: { type: [string, "null"] }
    SmartRoutePlan:
      type: object
      required: [region, startPoint, startTime, endTime, visitDurationMinutes, travelSpeedKmh, consideredDoctorCount, visitedDoctorCount, totalDistanceKm, totalTravelMinutes, totalWaitingMinutes, totalVisitMinutes, totalDurationMinutes, stops, omitted, assumptions, method]
      properties:
        region: { type: string }
        startPoint: { $ref: "#/components/schemas/DemoStartPoint" }
        startTime: { type: string }
        endTime: { type: string }
        visitDurationMinutes: { type: integer }
        travelSpeedKmh: { type: number }
        consideredDoctorCount: { type: integer }
        visitedDoctorCount: { type: integer }
        totalDistanceKm: { type: number }
        totalTravelMinutes: { type: integer }
        totalWaitingMinutes: { type: integer }
        totalVisitMinutes: { type: integer }
        totalDurationMinutes: { type: integer }
        stops: { type: array, items: { $ref: "#/components/schemas/SmartRouteStop" } }
        omitted: { type: array, items: { $ref: "#/components/schemas/SmartRouteOmission" } }
        assumptions: { type: array, items: { type: string } }
        method: { type: string }
    DemoSession:
      type: object
      required: [id, label, role, expiresAt]
      properties:
        id: { type: string }
        label: { type: string }
        role: { type: string, enum: [representative, clinic_demo] }
        expiresAt: { type: string }
    PendingVisitInput:
      type: object
      additionalProperties: false
      required: [doctorId]
      properties:
        doctorId: { type: integer, minimum: 1 }
    VerificationInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6, pattern: "^[0-9]{6}$" }
    PendingVisit:
      type: object
      required: [id, doctorId, doctorName, representativeId, representativeLabel, expiresAt, serverTime, status, attemptsRemaining, verifiedAt]
      properties:
        id: { type: string }
        doctorId: { type: integer }
        doctorName: { type: string }
        representativeId: { type: string }
        representativeLabel: { type: string }
        expiresAt: { type: string }
        serverTime: { type: string }
        status: { type: string, enum: [pending, confirmed, expired, locked, reported, superseded] }
        attemptsRemaining: { type: integer }
        verifiedAt: { type: [string, "null"] }
    ClinicDemoVisit:
      allOf:
        - { $ref: "#/components/schemas/PendingVisit" }
        - type: object
          required: [code]
          properties:
            code: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    DoctorInput:
      type: object
      additionalProperties: false
      required: [name, specialty, region, clinicAddress, latitude, longitude, visitingStart, visitingEnd, scientificInterests]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        specialty: { type: string, minLength: 2, maxLength: 100 }
        region: { type: string, minLength: 2, maxLength: 100 }
        clinicAddress: { type: string, minLength: 3, maxLength: 250 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        visitingStart: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        visitingEnd: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        scientificInterests: { type: string, minLength: 2, maxLength: 1000 }
    Doctor:
      allOf:
        - { $ref: "#/components/schemas/DoctorInput" }
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt: { type: string }
    Product:
      type: object
      required: [id, name, category, description, scientificTopic]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        scientificTopic: { type: string }
    VisitOutcome:
      type: string
      enum: [مهتم, متابعة لاحقة, غير مهتم, لم تتم الزيارة]
    VisitInput:
      type: object
      additionalProperties: false
      required: [doctorId, productId, outcome, notes, date, pendingVisitId]
      properties:
        pendingVisitId: { type: string, format: uuid }
        doctorId: { type: integer, minimum: 1 }
        productId: { type: integer, minimum: 1 }
        outcome: { $ref: "#/components/schemas/VisitOutcome" }
        notes: { type: string, minLength: 3, maxLength: 2000 }
        date: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    Visit:
      allOf:
        - type: object
          required: [doctorId, productId, outcome, notes, date, pendingVisitId, verificationStatus]
          properties:
            doctorId: { type: integer }
            productId: { type: integer }
            outcome: { $ref: "#/components/schemas/VisitOutcome" }
            notes: { type: string }
            date: { type: string }
            pendingVisitId: { type: [string, "null"] }
            verificationStatus: { type: string, enum: ["Confirmed by clinic demo code", "Unverified legacy report"] }
        - type: object
          required: [id, doctorName, doctorSpecialty, doctorRegion, productName, createdAt]
          properties:
            id: { type: integer }
            doctorName: { type: string }
            doctorSpecialty: { type: string }
            doctorRegion: { type: string }
            productName: { type: string }
            createdAt: { type: string }
    CountGroup:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    Dashboard:
      type: object
      required: [doctorCount, productCount, visitCount, monthVisitCount, interestedCount, visitedDoctorCount, outcomes, regions, recentVisits]
      properties:
        doctorCount: { type: integer }
        productCount: { type: integer }
        visitCount: { type: integer }
        monthVisitCount: { type: integer }
        interestedCount: { type: integer }
        visitedDoctorCount: { type: integer }
        outcomes: { type: array, items: { $ref: "#/components/schemas/CountGroup" } }
        regions: { type: array, items: { $ref: "#/components/schemas/CountGroup" } }
        recentVisits: { type: array, items: { $ref: "#/components/schemas/Visit" } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

